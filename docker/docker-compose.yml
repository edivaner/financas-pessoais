version: "3.9"

services:
  backend:
    build:
      context: ../financas-pessoais-laravel
      dockerfile: Dockerfile
    volumes:
      - ../financas-pessoais-laravel:/var/www/html
    environment:
      - APP_ENV=local
      - APP_SERVICE=backend
    depends_on:
      - mysql
      - mailhog
    ports:
      - "8000:8000"

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../financas-pessoais-vue:/app
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: finance
      MYSQL_USER: finance
      MYSQL_PASSWORD: finance
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  dbdata:
